<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mercado Lobato</title>
    <link rel="stylesheet" href="./css/pagina_inicial.css" />
  </head>

  <body>
    <header>
      <div class="navbar">
        <div class="header-inner-content">
          <h1 class="logo">
               <img src="img/Logo Supermercado Lobato – Preço Baixo.png" alt="logo Supermercado"></h1>
          <nav>
              <ul>
                  <li><button class="categoria" data-categoria="">Todos</button></li>

                  <li><button class="categoria" data-categoria="Higiene">Higiene</button></li>

                  <li><button class="categoria" data-categoria="Laticínios">Laticínios</button></li>

                  <li><button class="categoria" data-categoria="Papelaria">Papelaria</button></li>

                  <li><button class="categoria" data-categoria="Cereais">Cereais</button></li>

                  <li><button class="categoria" data-categoria="Bebidas">Bebidas</button></li>
              </ul>
        </nav>
         <div class="nav-icon-conteiner">

          <a href="pagina_cliente.html">
            <img src="img/perfil01.png" alt="Ìcone Perfil">
          </a>
          <a href="lista.html" aria-label="Abrir carrinho">
            <img src="img/5087784.png" alt="Carrinho de compras"/>
            <span id="contadorCarrinho">0</span>
          </a>

        </div>
        </div>
      </div>
    </header>
    <form class="busca" id="formBusca" role="search" autocomplete="off">
      <div>
        <label for="campoTexto">O que você procura?</label>
        <input
          type="search"
          id="campoTexto"
          placeholder="Ex.: arroz, feijão, leite..."
        />
      </div>
    </form>

    <section class="nomeProd">
       <h1 class="nomeProd">Produtos</h1>       
    </section>

    

    <p id="mensagemProdutos" role="status">Carregando produtos...</p>
    <div class="produtos" id="listaProdutos">
        
    </div>
    
    <script src="js/pagina_produto.js"></script>
  </body>
</html>
